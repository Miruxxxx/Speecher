# Конфигурация Speecher. Отсутствующие ключи берут значения по умолчанию
# (см. src/app_config.py). Файл можно удалить целиком — приложение запустится
# на дефолтах.

[audio]
# Звук захватывает нативный бинарь native/audio_capture (WASAPI, Rust).
# Собрать: cargo build --release --manifest-path native/audio_capture/Cargo.toml
device_hint = "Наушники гарнитуры (HyperX Virtual Surround Sound)"  # подстрока имени устройства ВЫВОДА (его слушаем в loopback)
target_sample_rate = 16000
restart_backoff_sec = 2.0     # пауза перед перезапуском упавшего capture-процесса
source = "loopback"           # loopback | mic (mic — задел на двухдорожечный режим)
binary = ""                   # "" = native/audio_capture/target/release/audio_capture.exe

[asr]
# whisper (дефолт) | nemotron (стриминговый, требует cu128-torch + transformers>=5.13);
# неизвестное значение → whisper
engine = "nemotron"
# tiny/base/small/medium/large-v3, либо полный HF repo id.
# large-v3-turbo указан явным репозиторием: короткий алиас в faster-whisper 1.2
# ведёт на dropbox-dash/*, а этот вариант уже лежит в локальном кэше.
model = "mobiuslabsgmbh/faster-whisper-large-v3-turbo"
device = "cuda"               # cuda | cpu
compute_type = "float16"      # float16 | int8 | auto
# "auto" = определить язык один раз по первой уверенной речи и зафиксировать;
# ""     = переопределять каждый цикл (старое поведение, даёт "кашу");
# "ru", "en", ... = жёстко фиксированный язык.
language = "auto"
sticky_min_probability = 0.7  # порог уверенности для фиксации языка в режиме auto
beam_size = 5
vad_min_silence_ms = 500
chunk_interval_sec = 1.0      # период цикла декодирования
min_audio_sec = 1.0
commit_safety_margin_sec = 0.1
max_buffer_sec = 25.0         # force-commit при превышении
force_commit_keep_tail_words = 6
buffer_max_seconds = 60.0     # жёсткий cap аудиобуфера

[asr.filters]
no_speech_prob_max = 0.9      # сегменты с no_speech_prob выше — отбрасываются
avg_logprob_min = -1.5        # сегменты с avg_logprob ниже — отбрасываются
max_word_repeats = 6          # схлопывать подряд идущие повторы слова (галлюцинации)
silence_rms_threshold = 1e-4  # RMS ниже порога = тишина, декод не запускается
empty_decodes_before_trim = 3 # после N пустых декодов подряд буфер подрезается
silence_keep_tail_sec = 2.0

[asr.nemotron]
# Читается только при engine = "nemotron".
model = "nvidia/nemotron-3.5-asr-streaming-0.6b"
device = "cuda"               # cuda | cpu
# float32 | float16 | bfloat16. fp16 — вдвое меньше VRAM (1217 МиБ против 2436)
# И НЕ МЕДЛЕННЕЕ: замер на probe.wav (64 с живой речи, по 3 прогона) даёт
# медиану декода чанка 37.8-39.1 мс против 43.2-44.3 мс у fp32, среднее вровень,
# транскрипт тот же. Прежний комментарий про «вдвое медленнее» не подтвердился.
# RTF в обоих случаях ~0.08, то есть запас по скорости ×12 в любом варианте.
dtype = "float16"
lookahead_tokens = 6          # 0 | 3 | 6 | 13 → задержка 80/320/560/1120 мс
language = "auto"  # "auto" | "ru" | "en-US" | ... (локали модели)

[punctuation]
backend = "silero"            # silero (ru/en/de/es, CPU) | off
# "auto" = брать язык по алфавиту самого текста (кириллица → ru, латиница → en).
# Это единственный вариант, который переживает asr.language = "auto": жёстко
# прописанный "ru" при английской речи запускает русскую модель по английскому
# тексту и портит слова. Немецкий/испанский надо ставить руками.
language = "auto"
interval_sec = 12.0
context_words = 80
# Запускать пунктуатор ПОВЕРХ движка, который пунктуирует сам (nemotron).
# По умолчанию выключено: на русском nemotron справляется. Включать имеет смысл
# на речи без пауз — лекция, созвон, — где модель почти не ставит знаков:
# замерено 0.7–6.7 % английских слов заканчивают предложение против 4.7–8.8 %
# на русском (docs/NEMOTRON_PUNCTUATION_TODO.md). Цена: ~230 МиБ RAM (не VRAM)
# и меньше 1 % одного ядра — вызов раз в interval_sec на одном потоке.
# Вопросительные знаки silero НЕ возвращает: для этого есть LLM-детект вопроса
# в кнопках «Ответить» / «Последний вопрос».
over_native = true

[llm]
# Кто отвечает на «Ответить» и делает «Выжимку». Список — src/llm/providers.py:
#   локально: lmstudio, ollama
#   облако:   openrouter, openai, anthropic, google, deepseek, groq, mistral,
#             xai, together, fireworks, cerebras, deepinfra
#   custom:   свой OpenAI-совместимый сервер (тогда обязателен base_url)
# ВАЖНО: API-ключ сюда НЕ пишется — этот файл в гите. Ключ хранится в
# диспетчере учётных данных Windows (или %APPDATA%\Speecher\credentials.json),
# задаётся в окне настроек. Также читается переменная окружения провайдера
# (OPENAI_API_KEY, ANTHROPIC_API_KEY, …), если ключ нигде не сохранён.
provider = "google"
base_url = ""                 # "" = адрес провайдера из реестра; нужен только для custom
model = "models/gemini-2.5-flash"  # "" = у локального сервера берётся загруженная модель
temperature = 0.6
max_tokens = 2048
request_timeout_sec = 120.0
health_timeout_sec = 2.0      # таймаут проверки доступности сервера
max_summary_chars = 6000      # лимит символов транскрипта в промпте саммари (лишнее с начала отбрасывается)
# Сколько модели позволено «думать» перед ответом (OpenAI-совместимый
# reasoning_effort). "none" — думать запрещено, "" — поле не отправлять.
# Проверено на LM Studio + qwen3.5-9b: работает только "none". Со включённым
# размышлением ответ уходит в reasoning_content, съедает весь max_tokens и
# наружу приходит ПУСТО. Старый /no_think новый LM Studio игнорирует.
reasoning_effort = "none"

# Запомненная модель по каждому провайдеру — пишется окном настроек, чтобы
# переключение туда-обратно не теряло выбор. Читается только когда model = "".
[llm.models]
anthropic = "claude-opus-5"
deepseek = "deepseek-chat"
google = "models/gemini-2.5-flash"

[translate]
# «Перевод на лету» работает как субтитры: речь режется на сегменты
# (предложение / пауза / предел слов), сегмент переводится целиком и падает в
# ленту ГОТОВОЙ строкой. Строка, попавшая в ленту, больше не меняется — ничего
# не гаснет, не подменяется и не перевёрстывается задним числом.
# Оригинал идёт своей обычной лентой в отдельном маленьком окне «Оригинал»
# (show_source): строки в нём остаются и прокручиваются, ничего не пропадает.
# Он же целиком остаётся в сторе, журнале и экспорте. Перевод локальный, LM Studio не участвует — очередь кнопок
# «Ответить» и «Выжимка» остаётся свободной.
backend = "nllb"      # nllb (любой язык одной моделью, ~2.5 ГБ) | opusmt (одна пара, ~300 МБ) | off
enabled = false  # включён ли перевод на старте; Alt+T переключает на ходу
target = "en"  # язык перевода: ru en de es fr it pt cs pl uk zh ja
show_source = true    # показывать окно с живым оригиналом, пока перевод включён
# "auto" = взять язык у ASR, а если и там auto — угадать по алфавиту текста.
# Для backend = "opusmt" язык-источник обязателен: чекпойнт существует на пару.
source = "auto"
model = ""            # "" = facebook/nllb-200-distilled-600M (или Helsinki-NLP/opus-mt-{src}-{tgt})
device = "cuda"       # cuda | cpu
dtype = "float16"     # float16 | bfloat16 | float32; на cpu всегда float32
close_after_sec = 1.5 # столько тишины после последнего слова — и хвост режется в строку
pause_sec = 1.2       # пауза между словами, обрывающая сегмент даже посреди фразы
max_words_per_segment = 40  # предел на случай речи без пунктуации и пауз
max_pending = 4       # больше сегментов в очереди не копим: сливаем в одну строку, чтобы догнать
poll_sec = 0.4
max_chars_per_chunk = 220  # длинный сегмент режется по предложениям: модели переводят предложение
max_new_tokens = 256
skip_same_script = true    # не переводить текст, уже написанный алфавитом целевого языка

[ui]
max_recent_chars = 700
console_verbose_logs = false  # показывать log-события движка в консоли
# Раскладка по дизайн-системе (docs/DESIGN_SYSTEM.md §3): обычный режим
# 600 × 340, компактный 360 × 200. Двойной клик по титульной строке переключает.
compact = false
# Где показывать ответ модели и выжимку (§7.9 DESIGN_SYSTEM.md):
#   "inline"        — карточкой внутри ленты, не выше 160 px (как было)
#   "side_large"    — двумя окнами по бокам главного окна (ответ и последний
#                     вопрос слева, выжимка справа), размером 600 × 340
#   "side_compact"  — тем же, но размером компактного режима, 360 × 200
# Боковые окна не закрываются сами и не двигают ленту; закрыть — крестик или Esc.
panels = "side_compact"
# Интервал кнопки «Выжимка» и хоткея Alt+5, в минутах. Подпись кнопки («за 5
# минут») собирается из этого значения, руками её писать нельзя (§6.6).
# 0 = интервал не задан: кнопка выжимает всю сессию и честно об этом пишет.
summary_interval_min = 5
auto_summary = false  # делать выжимку по интервалу автоматически
onboarding_shown = true   # окно приветствия показывается один раз

[logging]
# Лог пишется и в консоль, и в файл с ротацией. Файл нужен потому, что тихие
# отказы (движок откатился, журнал сорвался, ключ перестал работать) сообщают о
# себе строкой статуса, которая уезжает за несколько секунд, — а запуск с ярлыка
# консоли не оставляет вовсе.
dir = "storage/logs"          # "" = только консоль; относительный путь — от корня проекта
max_bytes = 2000000           # это диагностический хвост, а не архив
backups = 3

[hotkeys]
# Глобальные хоткеи (§5). Регистрируются через RegisterHotKey; занятую
# комбинацию приложение переживает — действие остаётся на кнопке, а поле
# в настройках подсвечивается «занято другим приложением».
# Пустая строка = не регистрировать.
toggle_window = "Alt+Space"  # показать/скрыть окно — и только это (§6.4)
toggle_recording = "Alt+R"
pause_recording = "Alt+P"
summary = "Alt+5"  # выжимка за summary_interval_min
answer = "Alt+Enter"
last_question = "Alt+Q"
history = "Alt+H"  # история выжимок / готовая выжимка
translate = "Alt+T"  # перевод на лету вкл/выкл (только на эту сессию)

[storage]
# Персист транскрипта: JSONL, одна строка на слово, плюс строки-патчи на
# правки пунктуации. Пишется через flush() сразу — падение процесса не теряет
# записанное. В оверлее есть переключатель ⏺: он включает/выключает запись на
# ходу, не трогая этот файл. Пустая сессия свой файл удаляет.
enabled = true
dir = "storage/transcripts"   # относительный путь считается от корня проекта
