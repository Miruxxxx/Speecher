name: tests

# Windows-only project (WASAPI loopback), so the tests run on Windows even
# though most of them would pass on Linux — a green tick on the wrong platform
# is worth less than no tick.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # No torch, no transformers, no models: every heavy import in src/ lives
      # inside a function, so the suite needs four packages and ~30 s. See the
      # header of requirements-test.txt.
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      # The Qt tests set this themselves, but a runner has no display at all
      # and one forgotten setdefault would hang the job rather than fail it.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  cargo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/audio_capture

      # The capture binary is the one part that cannot be exercised from
      # Python: tests/fake_capture.py speaks its protocol, but nothing checks
      # the Rust side except these.
      - name: Test the capture binary
        run: cargo test --manifest-path native/audio_capture/Cargo.toml

      - name: Build it
        run: cargo build --release --manifest-path native/audio_capture/Cargo.toml
